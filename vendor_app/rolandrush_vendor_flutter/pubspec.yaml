name: rolandrush_vendor
description: RolandRush Vendor Partner app - dashboard, orders, menu, wallet (Osun State)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6

  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  http: ^1.2.2

  google_fonts: ^6.2.1
  fl_chart: ^0.69.0 # for InsightsScreen-style revenue charts, later
  go_router: ^14.2.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
