name: rolandrush_customer
description: RolandRush customer app - TikTok-style food discovery & delivery (Osun State)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.6

  # Feed / media
  video_player: ^2.9.1
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.3.1

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Navigation
  go_router: ^14.2.0

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
