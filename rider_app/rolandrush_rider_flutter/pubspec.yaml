name: rolandrush_rider
description: RolandRush rider app - order fulfillment & earnings (Osun State)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.5.6

  # Document preview picker (no upload backend yet — see Documents screen)
  image_picker: ^1.1.2

  # Maps / location (swap in your preferred provider — Google Maps Flutter
  # or Mapbox both work; geolocator is provider-agnostic for reading GPS)
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1 # for tel: links (call restaurant/customer)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
